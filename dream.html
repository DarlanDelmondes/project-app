<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa dos Sonhos - Imersão</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            width: 100%; height: 100%; overflow: hidden;
            font-family: 'Inter', sans-serif; background-color: #121212;
            user-select: none;
        }

        #bg-container {
            position: fixed; top: -5%; left: -5%; width: 110vw; height: 110vh;
            background-size: cover; background-position: center;
            filter: blur(15px) brightness(0.4);
            z-index: 1; transition: background-image 0.5s ease-in-out;
        }

        header {
            position: fixed; top: 0; left: 0; width: 100%;
            padding: 40px 20px; text-align: center;
            z-index: 10; color: #ffffff; pointer-events: none;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.6);
        }

        #current-date { font-size: 1.2rem; font-weight: 300; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; opacity: 0.8; }
        #daily-message { font-size: 3rem; font-weight: 700; letter-spacing: -1px; }

        #viewport {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 5; cursor: grab;
        }
        #viewport:active { cursor: grabbing; }
        #canvas { position: absolute; top: 0; left: 0; transform-origin: 0 0; width: 0; height: 0; }

        /* Cartões */
        .card {
            position: absolute; background: #2a2a2a; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); cursor: grab;
            transform-origin: center center; display: flex; align-items: center; justify-content: center;
            transition: outline 0.2s, box-shadow 0.2s, opacity 0.4s ease, filter 0.4s ease;
            outline: 0px solid transparent; 
        }

        .card:active { cursor: grabbing; box-shadow: 0 15px 40px rgba(0,0,0,0.8); z-index: 1000; }
        .card.status-red { outline: 4px solid #ff4444; box-shadow: 0 0 30px rgba(255, 68, 68, 0.3); }
        .card.status-green { outline: 4px solid #00C851; box-shadow: 0 0 30px rgba(0, 200, 81, 0.3); }
        .card.dimmed { opacity: 0.1; filter: grayscale(100%) blur(3px); pointer-events: none; z-index: 1 !important; }

        .card img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; pointer-events: none; }
        .error-text { color: #ff6b6b; font-size: 0.8rem; text-align: center; padding: 15px; position: absolute; }

        /* Controles do Cartão */
        .semaphore-container {
            position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; z-index: 10;
            opacity: 0; transition: opacity 0.2s; background: rgba(0,0,0,0.6); padding: 5px; border-radius: 20px;
            backdrop-filter: blur(4px);
        }
        .card:hover .semaphore-container { opacity: 1; }
        .sema-btn { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; transition: transform 0.2s; border: 1px solid rgba(255,255,255,0.3); }
        .sema-btn:hover { transform: scale(1.4); border-color: #fff; }
        .sema-neutral { background: #888888; } .sema-red { background: #ff4444; } .sema-green { background: #00C851; }

        .control-btn {
            position: absolute; background: rgba(0, 0, 0, 0.7); color: white; border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%; width: 28px; height: 28px; font-size: 14px; display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.2s, background 0.2s; backdrop-filter: blur(4px);
        }
        .card:hover .control-btn { opacity: 1; }
        .delete-btn { top: -10px; right: -10px; cursor: pointer; } .delete-btn:hover { background: rgba(255, 50, 50, 0.9); }
        .rotate-handle { top: -35px; left: calc(50% - 14px); cursor: grab; } .rotate-handle:active { cursor: grabbing; }
        .rotate-line { position: absolute; top: -20px; left: 50%; width: 2px; height: 20px; background: rgba(255,255,255,0.5); opacity: 0; transition: opacity 0.2s; }
        .card:hover .rotate-line { opacity: 1; }
        .resize-handle { bottom: -10px; right: -10px; cursor: nwse-resize; font-size: 12px; }

        /* Doca e Menus */
        #bottom-left-dock {
            position: fixed; bottom: 30px; left: 30px; display: flex; gap: 15px; align-items: center;
            z-index: 20; opacity: 0.3; transition: opacity 0.4s ease;
        }
        #bottom-left-dock:hover { opacity: 1; }
        .dock-group {
            display: flex; gap: 10px; background: rgba(20, 20, 20, 0.6); padding: 8px 12px; border-radius: 30px;
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); align-items: center;
        }

        button.icon-btn, label.icon-btn {
            background: transparent; border: none; color: white; font-size: 1.2rem; cursor: pointer; transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; margin: 0;
        }
        button.icon-btn:hover, label.icon-btn:hover { background: rgba(255, 255, 255, 0.15); transform: scale(1.15); }

        /* Menu de Murais */
        #mural-indicator {
            color: white; font-size: 0.9rem; font-weight: 700; padding: 0 10px; cursor: pointer;
            border-right: 1px solid rgba(255,255,255,0.2); margin-right: 5px; display: flex; align-items: center; gap: 5px;
        }
        #mural-indicator:hover { color: #aaa; }

        #mural-modal {
            position: absolute; bottom: 60px; left: 0; background: rgba(20, 20, 20, 0.9); border-radius: 12px;
            backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); width: 220px; padding: 10px;
            display: none; flex-direction: column; gap: 5px; box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        #mural-modal.open { display: flex; }
        
        .mural-item {
            color: white; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 0.9rem;
            transition: background 0.2s; display: flex; justify-content: space-between; align-items: center;
        }
        .mural-item:hover { background: rgba(255,255,255,0.1); }
        .mural-item.active { background: rgba(255,255,255,0.2); font-weight: 700; }
        .del-mural { color: #ff6b6b; font-size: 0.8rem; border: none; background: transparent; cursor: pointer; display: none; }
        .mural-item:hover .del-mural { display: block; }
        .del-mural:hover { color: #ff0000; transform: scale(1.2); }
        
        #btn-new-mural {
            background: rgba(100, 150, 255, 0.2); border: 1px solid rgba(100, 150, 255, 0.4); color: white;
            padding: 10px; border-radius: 8px; cursor: pointer; margin-top: 5px; transition: background 0.2s;
        }
        #btn-new-mural:hover { background: rgba(100, 150, 255, 0.3); }

        /* Filtros Gerais e Porcentagens */
        .filter-group { display: flex; gap: 12px; align-items: center; padding-left: 10px; border-left: 1px solid rgba(255,255,255,0.2); }
        .filter-wrapper { display: flex; align-items: center; gap: 6px; }
        .filter-pct { font-size: 0.65rem; color: rgba(255,255,255,0.4); font-weight: 700; min-width: 20px; transition: color 0.2s; }
        
        .filter-btn { width: 16px; height: 16px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: all 0.2s; }
        .filter-btn:hover { transform: scale(1.2); }
        .filter-btn.active { border-color: white; transform: scale(1.2); box-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .filter-btn.active + .filter-pct { color: rgba(255,255,255,0.9); } /* Destaca o percentual ativo */

        .f-all { background: transparent; border: 2px solid rgba(255,255,255,0.4); display: flex; align-items: center; justify-content: center;}
        .f-all::after { content: ''; width: 4px; height: 4px; background: white; border-radius: 50%; }
        .f-all.active { border-color: white; }
        .f-neutral { background: #888888; } .f-red { background: #ff4444; } .f-green { background: #00C851; }

        #folder-display {
            position: absolute; bottom: 100%; left: 10px; margin-bottom: 10px; color: rgba(255,255,255,0.5); font-size: 0.75rem;
            background: rgba(0,0,0,0.4); padding: 4px 10px; border-radius: 10px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 0.3s;
        }
        #bottom-left-dock:hover #folder-display { opacity: 1; }

    </style>
</head>
<body>

    <div id="bg-container"></div>

    <header>
        <div id="current-date"></div>
        <div id="daily-message">o que você quer fazer hoje?</div>
    </header>

    <div id="viewport">
        <div id="canvas"></div>
    </div>

    <div id="bottom-left-dock">
        <div id="folder-display">📁 <span id="current-folder-text">Nenhuma</span></div>
        
        <div class="dock-group">
            
            <div style="position: relative;">
                <div id="mural-indicator" title="Alternar Mural">
                    <span id="active-mural-name">Mural</span> ⏷
                </div>
                <div id="mural-modal">
                    <div id="mural-list"></div>
                    <button id="btn-new-mural">+ Novo Mural</button>
                </div>
            </div>

            <button class="icon-btn" id="btn-config-folder" title="Configurar Pasta Base">⚙️</button>
            <button class="icon-btn" id="btn-bg" title="Imagem de Fundo">🖼️</button>
            <button class="icon-btn" id="btn-card-url" title="Adicionar Imagem (URL Web)">🌐</button>
            
            <label class="icon-btn" title="Adicionar Arquivo Local">
                💻
                <input type="file" id="file-upload" accept="image/*" style="display: none;">
            </label>

            <div class="filter-group" title="Filtros de Visão">
                <div class="filter-wrapper">
                    <div class="filter-btn f-all active" data-filter="all" title="Mostrar Todos"></div>
                    <span class="filter-pct" id="pct-all">100%</span>
                </div>
                <div class="filter-wrapper">
                    <div class="filter-btn f-neutral" data-filter="neutral" title="Apenas Neutros"></div>
                    <span class="filter-pct" id="pct-neutral">0%</span>
                </div>
                <div class="filter-wrapper">
                    <div class="filter-btn f-red" data-filter="red" title="Apenas Prioridade"></div>
                    <span class="filter-pct" id="pct-red">0%</span>
                </div>
                <div class="filter-wrapper">
                    <div class="filter-btn f-green" data-filter="green" title="Apenas Concluídos"></div>
                    <span class="filter-pct" id="pct-green">0%</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- DATA ---
        function setDate() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('current-date').innerText = new Date().toLocaleDateString('pt-BR', options);
        }
        setDate();

        // --- ESTADO GLOBAL (MURAIS) ---
        let murals = [];
        let activeMuralId = null;
        
        let scale = 1, translateX = 0, translateY = 0;
        let activeFilter = 'all';
        const sessionBlobs = {}; 

        const viewport = document.getElementById('viewport');
        const canvas = document.getElementById('canvas');
        const bgContainer = document.getElementById('bg-container');
        const folderText = document.getElementById('current-folder-text');
        const muralModal = document.getElementById('mural-modal');
        const muralIndicatorText = document.getElementById('active-mural-name');

        function getCurrentMural() {
            return murals.find(m => m.id === activeMuralId) || murals[0];
        }

        // --- SISTEMA DE ARQUIVOS E MIGRAÇÃO ---
        function loadAndMigrateData() {
            const savedMurals = localStorage.getItem('dreamMap_Murals');
            
            if (!savedMurals) {
                const oldCards = localStorage.getItem('dreamMapCards_v5') || localStorage.getItem('dreamMapCards_v4') || '[]';
                const oldBg = localStorage.getItem('dreamMapBg_v5') || localStorage.getItem('dreamMapBg_v4') || '';
                const oldFolder = localStorage.getItem('dreamMapFolder_v5') || localStorage.getItem('dreamMapFolder_v4') || '';

                const defaultMural = {
                    id: 'mural-' + Date.now(),
                    name: 'Mural Principal',
                    cards: JSON.parse(oldCards),
                    bg: oldBg,
                    folder: oldFolder
                };

                murals = [defaultMural];
                activeMuralId = defaultMural.id;
                saveData();
            } else {
                murals = JSON.parse(savedMurals);
                activeMuralId = localStorage.getItem('dreamMap_ActiveMural') || murals[0].id;
            }
            
            applyMuralState();
            renderMuralMenu();
        }

        function saveData() {
            localStorage.setItem('dreamMap_Murals', JSON.stringify(murals));
            localStorage.setItem('dreamMap_ActiveMural', activeMuralId);
        }

        function applyMuralState() {
            const mural = getCurrentMural();
            muralIndicatorText.innerText = mural.name;
            folderText.innerText = mural.folder || "Nenhuma";
            
            if (mural.bg) {
                bgContainer.style.backgroundImage = `url('${mural.bg}')`;
            } else {
                bgContainer.style.backgroundImage = `url('https://images.unsplash.com/photo-1506744626753-1fa44df14d28?q=80&w=2000&auto=format&fit=crop')`;
            }
            
            scale = 1; translateX = 0; translateY = 0; updateTransform();
            renderCards();
        }

        // --- GERENCIAMENTO DE MURAIS (UI) ---
        document.getElementById('mural-indicator').addEventListener('click', (e) => {
            e.stopPropagation();
            muralModal.classList.toggle('open');
        });

        window.addEventListener('click', () => {
            muralModal.classList.remove('open');
        });

        muralModal.addEventListener('click', (e) => e.stopPropagation());

        function renderMuralMenu() {
            const list = document.getElementById('mural-list');
            list.innerHTML = '';
            
            murals.forEach(m => {
                const item = document.createElement('div');
                item.className = `mural-item ${m.id === activeMuralId ? 'active' : ''}`;
                
                const nameSpan = document.createElement('span');
                nameSpan.innerText = m.name;
                nameSpan.onclick = () => {
                    activeMuralId = m.id;
                    saveData();
                    applyMuralState();
                    renderMuralMenu();
                    muralModal.classList.remove('open');
                };

                item.appendChild(nameSpan);

                if (murals.length > 1) {
                    const del = document.createElement('button');
                    del.className = 'del-mural';
                    del.innerHTML = '🗑️';
                    del.onclick = (e) => {
                        e.stopPropagation();
                        if (confirm(`Excluir o mural "${m.name}"?`)) {
                            murals = murals.filter(mx => mx.id !== m.id);
                            if (activeMuralId === m.id) activeMuralId = murals[0].id;
                            saveData(); applyMuralState(); renderMuralMenu();
                        }
                    };
                    item.appendChild(del);
                }
                list.appendChild(item);
            });
        }

        document.getElementById('btn-new-mural').addEventListener('click', () => {
            const name = prompt("Nome do novo Mural:");
            if (name && name.trim() !== '') {
                const newMural = {
                    id: 'mural-' + Date.now(),
                    name: name.trim(),
                    cards: [], bg: '', folder: ''
                };
                murals.push(newMural);
                activeMuralId = newMural.id;
                saveData(); applyMuralState(); renderMuralMenu();
                muralModal.classList.remove('open');
            }
        });

        // --- PAN & ZOOM ---
        function updateTransform() {
            canvas.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        }

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = -e.deltaY * 0.0015;
            let newScale = Math.min(Math.max(0.1, scale * Math.exp(delta)), 5);
            const rect = viewport.getBoundingClientRect();
            translateX = (e.clientX - rect.left) - ((e.clientX - rect.left) - translateX) * (newScale / scale);
            translateY = (e.clientY - rect.top) - ((e.clientY - rect.top) - translateY) * (newScale / scale);
            scale = newScale; updateTransform();
        });

        let isPanning = false; let startPanX, startPanY;
        viewport.addEventListener('mousedown', (e) => {
            if (e.target.closest('.card') || e.target.closest('#bottom-left-dock')) return;
            isPanning = true; startPanX = e.clientX - translateX; startPanY = e.clientY - translateY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isPanning) return;
            translateX = e.clientX - startPanX; translateY = e.clientY - startPanY; updateTransform();
        });
        window.addEventListener('mouseup', () => { isPanning = false; });

        // --- CAMADAS, FILTROS E MÉTRICAS ---
        function bringToFront(id) {
            const mural = getCurrentMural();
            const index = mural.cards.findIndex(c => c.id === id);
            if (index > -1 && index !== mural.cards.length - 1) {
                const [card] = mural.cards.splice(index, 1);
                mural.cards.push(card);
                saveData();
                const cardEl = document.querySelector(`.card[data-id="${id}"]`);
                if (cardEl) canvas.appendChild(cardEl);
            }
        }

        function setStatus(id, status, el) {
            const mural = getCurrentMural();
            const card = mural.cards.find(c => c.id === id);
            if(card) {
                card.status = status;
                el.classList.remove('status-red', 'status-green');
                el.dataset.status = status;
                if (status === 'red') el.classList.add('status-red');
                if (status === 'green') el.classList.add('status-green');
                saveData(); applyFilterEngine(); updatePercentages();
            }
        }

        function applyFilterEngine() {
            document.querySelectorAll('.card').forEach(el => {
                if (activeFilter === 'all' || (el.dataset.status || 'neutral') === activeFilter) {
                    el.classList.remove('dimmed');
                } else {
                    el.classList.add('dimmed');
                }
            });
        }

        // NOVO: Cálculo Dinâmico de Métricas
        function updatePercentages() {
            const mural = getCurrentMural();
            const total = mural.cards.length;
            
            let counts = { 'neutral': 0, 'red': 0, 'green': 0 };
            mural.cards.forEach(c => {
                let s = c.status || 'neutral';
                if(counts[s] !== undefined) counts[s]++;
            });

            const calcPct = (count) => total === 0 ? '0%' : Math.round((count / total) * 100) + '%';

            document.getElementById('pct-all').innerText = total === 0 ? '0%' : '100%';
            document.getElementById('pct-neutral').innerText = calcPct(counts['neutral']);
            document.getElementById('pct-red').innerText = calcPct(counts['red']);
            document.getElementById('pct-green').innerText = calcPct(counts['green']);
        }

        // --- RENDERIZAÇÃO DOS CARTÕES ---
        function renderCards() {
            canvas.innerHTML = '';
            const mural = getCurrentMural();
            
            mural.cards.forEach(cardData => {
                cardData.status = cardData.status || 'neutral';

                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                cardEl.style.left = `${cardData.x}px`; cardEl.style.top = `${cardData.y}px`;
                cardEl.style.width = `${cardData.width}px`; cardEl.style.height = `${cardData.height}px`;
                cardEl.style.transform = `rotate(${cardData.rotation}deg)`;
                cardEl.dataset.id = cardData.id;
                cardEl.dataset.status = cardData.status;

                if (cardData.status === 'red') cardEl.classList.add('status-red');
                if (cardData.status === 'green') cardEl.classList.add('status-green');

                const img = document.createElement('img');
                
                if (sessionBlobs[cardData.id]) {
                    img.src = sessionBlobs[cardData.id];
                } else if (cardData.isLocal) {
                    const prefix = (mural.folder && !mural.folder.endsWith('/')) ? mural.folder + '/' : mural.folder;
                    img.src = prefix + cardData.filename;
                } else {
                    img.src = cardData.url;
                }
                
                img.onerror = () => { 
                    img.style.display = 'none';
                    const err = document.createElement('div');
                    err.className = 'error-text';
                    err.innerHTML = cardData.isLocal ? `Erro local` : 'Erro URL';
                    cardEl.appendChild(err);
                };

                const semaContainer = document.createElement('div');
                semaContainer.className = 'semaphore-container';
                ['neutral', 'red', 'green'].forEach(s => {
                    const btn = document.createElement('div');
                    btn.className = `sema-btn sema-${s}`;
                    btn.onclick = (e) => { e.stopPropagation(); setStatus(cardData.id, s, cardEl); };
                    semaContainer.appendChild(btn);
                });

                const delBtn = document.createElement('div');
                delBtn.className = 'control-btn delete-btn'; delBtn.innerHTML = '✕';
                delBtn.onclick = (e) => { e.stopPropagation(); deleteCard(cardData.id); };

                const rotBtn = document.createElement('div');
                rotBtn.className = 'control-btn rotate-handle'; rotBtn.innerHTML = '↻';
                rotBtn.onmousedown = (e) => startRotate(e, cardData.id, cardEl);

                const resBtn = document.createElement('div');
                resBtn.className = 'control-btn resize-handle'; resBtn.innerHTML = '⤡';
                resBtn.onmousedown = (e) => startResize(e, cardData.id, cardEl);

                cardEl.appendChild(img); cardEl.appendChild(semaContainer);
                cardEl.appendChild(document.createElement('div')).className = 'rotate-line';
                cardEl.appendChild(rotBtn); cardEl.appendChild(resBtn); cardEl.appendChild(delBtn);
                canvas.appendChild(cardEl);

                cardEl.addEventListener('mousedown', (e) => {
                    if(e.target.classList.contains('control-btn') || e.target.classList.contains('sema-btn')) return;
                    startDragCard(e, cardData.id, cardEl);
                });

                cardEl.addEventListener('dblclick', (e) => {
                    if(e.target.classList.contains('control-btn') || e.target.classList.contains('sema-btn')) return;
                    bringToFront(cardData.id);
                });
            });
            
            applyFilterEngine();
            updatePercentages(); // Atualiza a métrica sempre que os cartões são renderizados
        }

        // --- LÓGICA FÍSICA ---
        let activeAction = null, activeCardId = null, activeCardEl = null;
        let startX, startY, initialVal1, initialVal2;

        function startDragCard(e, id, el) {
            e.stopPropagation(); activeAction = 'drag'; activeCardId = id; activeCardEl = el;
            const card = getCurrentMural().cards.find(c => c.id === id);
            initialVal1 = card.x; initialVal2 = card.y; startX = e.clientX; startY = e.clientY; el.style.zIndex = 1000;
        }

        function startResize(e, id, el) {
            e.stopPropagation(); activeAction = 'resize'; activeCardId = id; activeCardEl = el;
            const card = getCurrentMural().cards.find(c => c.id === id);
            initialVal1 = card.width; initialVal2 = card.height; startX = e.clientX; startY = e.clientY;
        }

        function startRotate(e, id, el) {
            e.stopPropagation(); activeAction = 'rotate'; activeCardId = id; activeCardEl = el;
            const rect = el.getBoundingClientRect(); initialVal1 = rect.left + rect.width / 2; initialVal2 = rect.top + rect.height / 2;
        }

        window.addEventListener('mousemove', (e) => {
            if (!activeAction || !activeCardId) return;
            const card = getCurrentMural().cards.find(c => c.id === activeCardId);

            if (activeAction === 'drag') {
                card.x = initialVal1 + (e.clientX - startX) / scale; card.y = initialVal2 + (e.clientY - startY) / scale;
                activeCardEl.style.left = `${card.x}px`; activeCardEl.style.top = `${card.y}px`;
            } else if (activeAction === 'resize') {
                card.width = Math.max(100, initialVal1 + (e.clientX - startX) / scale); card.height = Math.max(100, initialVal2 + (e.clientY - startY) / scale);
                activeCardEl.style.width = `${card.width}px`; activeCardEl.style.height = `${card.height}px`;
            } else if (activeAction === 'rotate') {
                card.rotation = (Math.atan2(e.clientY - initialVal2, e.clientX - initialVal1) * 180 / Math.PI) + 90;
                activeCardEl.style.transform = `rotate(${card.rotation}deg)`;
            }
        });

        window.addEventListener('mouseup', () => {
            if (activeAction) {
                if(activeCardEl && activeAction === 'drag') activeCardEl.style.zIndex = '';
                activeAction = null; activeCardId = null; activeCardEl = null; saveData();
            }
        });

        function deleteCard(id) {
            const mural = getCurrentMural();
            mural.cards = mural.cards.filter(c => c.id !== id);
            saveData(); renderCards();
        }

        // --- INTERAÇÕES DA DOCA ---
        function getCenterCoords() {
            return { x: (-translateX + window.innerWidth / 2) / scale - 150, y: (-translateY + window.innerHeight / 2) / scale - 100 };
        }

        document.getElementById('btn-card-url').addEventListener('click', () => {
            const url = prompt("Insira a URL da imagem:");
            if (url && url.trim() !== '') {
                getCurrentMural().cards.push({ id: Date.now().toString(), isLocal: false, url: url.trim(), status: 'neutral', ...getCenterCoords(), width: 300, height: 200, rotation: 0 });
                saveData(); renderCards();
            }
        });

        document.getElementById('file-upload').addEventListener('change', function(e) {
            if (e.target.files[0]) {
                const newId = Date.now().toString();
                sessionBlobs[newId] = URL.createObjectURL(e.target.files[0]);
                getCurrentMural().cards.push({ id: newId, isLocal: true, filename: e.target.files[0].name, status: 'neutral', ...getCenterCoords(), width: 300, height: 200, rotation: 0 });
                saveData(); renderCards();
            }
            this.value = ''; 
        });

        document.getElementById('btn-config-folder').addEventListener('click', () => {
            const mural = getCurrentMural();
            const folder = prompt("Caminho da pasta (Ex: imagens/):", mural.folder);
            if (folder !== null) {
                mural.folder = folder.trim(); folderText.innerText = mural.folder || "Nenhuma";
                saveData(); renderCards(); 
            }
        });

        document.getElementById('btn-bg').addEventListener('click', () => {
            const url = prompt("URL da imagem de fundo:");
            if (url && url.trim() !== '') {
                getCurrentMural().bg = url.trim(); bgContainer.style.backgroundImage = `url('${url.trim()}')`; saveData();
            }
        });

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active'); activeFilter = e.target.dataset.filter; applyFilterEngine();
            });
        });

        // INICIALIZAÇÃO
        loadAndMigrateData();
    </script>
</body>
</html>
