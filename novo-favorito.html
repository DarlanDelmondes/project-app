<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favoritos & Workspaces</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --success: #10b981;
            --sidebar-width: 420px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 2rem;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #334155;
        }

        .controls {
            display: flex;
            gap: 1rem;
        }

        button {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid #334155;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        button:hover { background-color: #334155; }
        button.primary { background-color: var(--primary); border-color: var(--primary); }
        button.primary:hover { background-color: var(--primary-hover); }

        /* Grid de Cards */
        #grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            align-items: start;
        }

        /* Card do Grupo & Arrastar e Soltar */
        .group-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid #334155;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
        }

        .group-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            border-color: #475569;
        }

        /* Efeitos visuais do Drag and Drop */
        .group-card.dragging {
            opacity: 0.4;
            transform: scale(0.95);
        }

        .group-card.drag-over {
            border: 2px dashed var(--primary);
            transform: scale(1.02);
        }

        /* Impede que elementos filhos roubem o evento de drag causando flickering */
        body.is-dragging .group-card * {
            pointer-events: none !important;
        }

        .card-header {
            height: 160px;
            background-size: cover;
            background-position: center;
            position: relative;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.85) 100%);
            z-index: 1;
        }

        .card-actions {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
            opacity: 0;
            transition: opacity 0.2s;
            margin-bottom: 1rem;
            pointer-events: none; /* Garante que o container invisível não roube cliques */
        }

        .card-header:hover .card-actions { opacity: 1; }

        .icon-btn {
            background: rgba(0,0,0,0.5); border: none; color: white;
            padding: 0.25rem 0.5rem; font-size: 0.8rem; border-radius: 4px;
            pointer-events: auto; /* Reativa os cliques apenas exatamente em cima do botão */
        }
        .icon-btn:hover { background: rgba(0,0,0,0.8); }

        .header-bottom {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            height: 100%;
            justify-content: flex-end;
        }

        .card-title {
            font-size: 1.25rem; font-weight: 600; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* Tags dos Mais Clicados */
        .top-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; pointer-events: auto; }

        .top-tag {
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.2); color: var(--text-main);
            font-size: 0.7rem; padding: 0.3rem 0.6rem; border-radius: 12px;
            cursor: pointer; transition: all 0.2s; white-space: nowrap;
            max-width: 140px; overflow: hidden; text-overflow: ellipsis;
            z-index: 3;
        }

        .top-tag:hover {
            background: var(--primary); border-color: var(--primary); transform: translateY(-1px);
        }

        /* Sidebar (Barra Lateral) */
        .sidebar-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); z-index: 50;
            display: none; opacity: 0; transition: opacity 0.3s;
            backdrop-filter: blur(2px);
        }
        .sidebar-overlay.active { display: block; opacity: 1; }

        .sidebar {
            position: fixed; top: 0; right: calc(var(--sidebar-width) * -1);
            width: var(--sidebar-width); max-width: 100vw; height: 100vh;
            background: var(--bg-color); border-left: 1px solid #334155;
            z-index: 60; transition: right 0.3s ease;
            display: flex; flex-direction: column;
            box-shadow: -5px 0 25px rgba(0,0,0,0.5);
        }
        .sidebar.active { right: 0; }

        .sidebar-header {
            padding: 1.5rem; border-bottom: 1px solid #334155;
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-bg);
        }
        .sidebar-title { font-size: 1.25rem; font-weight: 600; }
        .close-sidebar-btn { background: transparent; border: none; font-size: 1.5rem; padding: 0 0.5rem; cursor: pointer;}
        .close-sidebar-btn:hover { color: var(--danger); }

        .sidebar-content {
            padding: 1.5rem; overflow-y: auto; flex-grow: 1;
            display: flex; flex-direction: column; gap: 1rem;
        }

        /* Links na Sidebar */
        .link-item {
            background: var(--card-bg); border: 1px solid #334155;
            padding: 1rem; border-radius: 8px;
            display: flex; flex-direction: column; gap: 0.75rem;
        }

        .link-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .link-title { font-weight: 500; font-size: 1rem; color: var(--text-main); word-break: break-word; }
        .link-clicks { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem; display: block; }
        
        .link-actions-top { display: flex; gap: 0.4rem; }
        .link-actions-top button { padding: 0.25rem 0.5rem; font-size: 0.8rem; }

        .add-link-btn { width: 100%; border-style: dashed; padding: 1rem; margin-top: 0.5rem; }

        /* Modais */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7); display: none;
            justify-content: center; align-items: center; z-index: 100;
        }
        .modal-overlay.active { display: flex; }

        .modal-content {
            background: var(--card-bg); padding: 2rem; border-radius: 8px;
            width: 100%; max-width: 400px; border: 1px solid #334155;
        }
        .form-group { margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
        input { width: 100%; padding: 0.75rem; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 4px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem; }

        /* Toast */
        .toast {
            position: fixed; bottom: 2rem; right: 2rem; background: var(--success);
            color: white; padding: 1rem 1.5rem; border-radius: 6px;
            transform: translateY(100px); opacity: 0; transition: all 0.3s ease; z-index: 1000;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <header>
        <h1>Workspaces</h1>
        <div class="controls">
            <input type="file" id="import-file" style="display: none" accept=".json">
            <button onclick="document.getElementById('import-file').click()">📥 Importar</button>
            <button onclick="exportData()">📤 Exportar</button>
            <button class="primary" onclick="openGroupModal()">+ Novo Grupo</button>
        </div>
    </header>

    <main id="grid-container"></main>

    <!-- Sidebar Direita para os Favoritos -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title" id="sidebar-title">Nome do Grupo</div>
            <button class="close-sidebar-btn" onclick="closeSidebar()">✕</button>
        </div>
        <div class="sidebar-content" id="sidebar-content">
            <!-- Links renderizados via JS -->
        </div>
    </div>

    <!-- Modal Grupo -->
    <div class="modal-overlay" id="group-modal">
        <div class="modal-content">
            <h2 class="modal-title" id="group-modal-title">Novo Grupo</h2>
            <input type="hidden" id="group-id">
            <div class="form-group">
                <label>Título do Grupo</label>
                <input type="text" id="group-title" placeholder="Ex: Infra AWS">
            </div>
            <div class="form-group">
                <label>URL da Imagem de Fundo</label>
                <input type="text" id="group-bg" placeholder="https://...">
            </div>
            <div class="modal-actions">
                <button onclick="closeModals()">Cancelar</button>
                <button class="primary" onclick="saveGroup()">Salvar</button>
            </div>
        </div>
    </div>

    <!-- Modal Link (Serve para Adicionar e Editar) -->
    <div class="modal-overlay" id="link-modal">
        <div class="modal-content">
            <h2 class="modal-title" id="link-modal-title">Novo Favorito</h2>
            <input type="hidden" id="link-group-id">
            <input type="hidden" id="link-id">
            
            <div class="form-group">
                <label>Título do Link</label>
                <input type="text" id="link-title" placeholder="Ex: Console de Pagamentos">
            </div>
            <div class="form-group">
                <label>URL</label>
                <input type="text" id="link-url" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>Texto Oculto para Copiar (Opcional)</label>
                <input type="text" id="link-copy" placeholder="Ex: credenciais, comandos a copiar no clique">
            </div>
            <div class="modal-actions">
                <button onclick="closeModals()">Cancelar</button>
                <button class="primary" onclick="saveLink()">Salvar</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Ação realizada com sucesso!</div>

    <script>
        let groups = JSON.parse(localStorage.getItem('workspaces_data')) || [];
        let currentOpenGroupId = null;
        let dragSourceElement = null; 

        function saveData() {
            localStorage.setItem('workspaces_data', JSON.stringify(groups));
            renderGrid();
            if (currentOpenGroupId) renderSidebar(currentOpenGroupId);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // --- Renderização Principal (Grid) ---
        function renderGrid() {
            const grid = document.getElementById('grid-container');
            grid.innerHTML = '';

            groups.sort((a, b) => (a.order || 0) - (b.order || 0));

            groups.forEach((group, index) => {
                const card = document.createElement('div');
                card.className = 'group-card';
                card.id = `group-${group.id}`;
                card.draggable = true; 
                
                // O card INTEIRO abre a sidebar
                card.onclick = () => openSidebar(group.id);
                
                // Listeners de Drag and Drop
                card.addEventListener('dragstart', handleDragStart);
                card.addEventListener('dragover', handleDragOver);
                card.addEventListener('dragenter', handleDragEnter);
                card.addEventListener('dragleave', handleDragLeave);
                card.addEventListener('drop', handleDrop);
                card.addEventListener('dragend', handleDragEnd);
                
                const bgImage = group.bgImage || 'https://images.unsplash.com/photo-1550684848-fac1c5b4e853?auto=format&fit=crop&w=500&q=80';

                const topLinks = [...group.links]
                    .sort((a, b) => (b.clicks || 0) - (a.clicks || 0))
                    .slice(0, 5);

                const tagsHtml = topLinks.length > 0 ? `
                    <div class="top-tags">
                        ${topLinks.map(link => `
                            <!-- event.stopPropagation() garante que clicar na tag executa o link sem abrir a sidebar -->
                            <button class="top-tag" onclick="handleTagClick(event, '${group.id}', '${link.id}', '${link.url}', '${(link.copyText||'').replace(/'/g, "\\'")}')" title="${link.title}">
                                ${link.title}
                            </button>
                        `).join('')}
                    </div>
                ` : '';

                card.innerHTML = `
                    <div class="card-header" style="background-image: url('${bgImage}')">
                        <div class="card-actions">
                            <!-- O event.stopPropagation() isola o clique EXATAMENTE no botão -->
                            <button class="icon-btn" onclick="event.stopPropagation(); openGroupModal('${group.id}')" title="Editar Grupo">✏️</button>
                            <button class="icon-btn" onclick="event.stopPropagation(); deleteGroup('${group.id}')" title="Excluir Grupo">🗑️</button>
                        </div>
                        <div class="header-bottom">
                            <div class="card-title">${group.title}</div>
                            ${tagsHtml}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // --- Lógica de Drag and Drop ---
        function handleDragStart(e) {
            dragSourceElement = this;
            this.classList.add('dragging');
            document.body.classList.add('is-dragging'); 
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragOver(e) {
            if (e.preventDefault) e.preventDefault(); 
            e.dataTransfer.dropEffect = 'move';
            return false;
        }

        function handleDragEnter(e) {
            if (this !== dragSourceElement) {
                this.classList.add('drag-over');
            }
        }

        function handleDragLeave(e) {
            this.classList.remove('drag-over');
        }

        function handleDrop(e) {
            if (e.stopPropagation) e.stopPropagation();

            if (dragSourceElement !== this) {
                const srcId = dragSourceElement.id.replace('group-', '');
                const tgtId = this.id.replace('group-', '');
                
                const srcIdx = groups.findIndex(g => g.id === srcId);
                const tgtIdx = groups.findIndex(g => g.id === tgtId);

                // Reordena o array
                const draggedItem = groups.splice(srcIdx, 1)[0];
                groups.splice(tgtIdx, 0, draggedItem);

                // Atualiza as ordens internamente
                groups.forEach((g, i) => g.order = i);
                saveData();
            }
            return false;
        }

        function handleDragEnd(e) {
            this.classList.remove('dragging');
            document.body.classList.remove('is-dragging');
            document.querySelectorAll('.group-card').forEach(c => c.classList.remove('drag-over'));
        }

        // --- Lógica da Sidebar ---
        function openSidebar(groupId) {
            currentOpenGroupId = groupId;
            renderSidebar(groupId);
            
            document.getElementById('sidebar-overlay').classList.add('active');
            document.getElementById('sidebar').classList.add('active');
        }

        function closeSidebar() {
            document.getElementById('sidebar-overlay').classList.remove('active');
            document.getElementById('sidebar').classList.remove('active');
            currentOpenGroupId = null;
        }

        function renderSidebar(groupId) {
            const group = groups.find(g => g.id === groupId);
            if (!group) return;

            document.getElementById('sidebar-title').innerText = group.title;
            const content = document.getElementById('sidebar-content');
            
            content.innerHTML = group.links.map(link => `
                <div class="link-item">
                    <div class="link-header">
                        <div>
                            <div class="link-title">${link.title}</div>
                            <span class="link-clicks">Acessos: ${link.clicks || 0}</span>
                        </div>
                        <div class="link-actions-top">
                            <button onclick="openLinkModal('${group.id}', '${link.id}')" title="Editar">✏️</button>
                            <button onclick="deleteLink('${group.id}', '${link.id}')" title="Excluir">🗑️</button>
                        </div>
                    </div>
                    <button class="primary" onclick="executeLinkAction('${group.id}', '${link.id}', '${link.url}', '${(link.copyText||'').replace(/'/g, "\\'")}')" style="width: 100%">
                        Abrir Link ${link.copyText ? '& Copiar' : ''}
                    </button>
                </div>
            `).join('');

            content.innerHTML += `<button class="add-link-btn" onclick="openLinkModal('${group.id}')">+ Adicionar Favorito</button>`;
        }

        // --- Ações de Clique ---
        function handleTagClick(event, groupId, linkId, url, copyText) {
            event.stopPropagation(); // BLOQUEIA o clique para não abrir a sidebar
            executeLinkAction(groupId, linkId, url, copyText);
        }

        function executeLinkAction(groupId, linkId, url, textToCopy) {
            const group = groups.find(g => g.id === groupId);
            if (group) {
                const link = group.links.find(l => l.id === linkId);
                if (link) {
                    link.clicks = (link.clicks || 0) + 1;
                    saveData(); 
                }
            }

            if (textToCopy && textToCopy.trim() !== '') {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    showToast('Texto copiado para a área de transferência!');
                    window.open(url, '_blank');
                }).catch(err => {
                    window.open(url, '_blank');
                });
            } else {
                window.open(url, '_blank');
            }
        }

        // --- CRUD Grupos ---
        function openGroupModal(id = null) {
            document.getElementById('group-modal').classList.add('active');
            if (id) {
                const group = groups.find(g => g.id === id);
                document.getElementById('group-id').value = group.id;
                document.getElementById('group-title').value = group.title;
                document.getElementById('group-bg').value = group.bgImage;
                document.getElementById('group-modal-title').innerText = "Editar Grupo";
            } else {
                document.getElementById('group-id').value = '';
                document.getElementById('group-title').value = '';
                document.getElementById('group-bg').value = '';
                document.getElementById('group-modal-title').innerText = "Novo Grupo";
            }
        }

        function saveGroup() {
            const id = document.getElementById('group-id').value;
            const title = document.getElementById('group-title').value;
            const bgImage = document.getElementById('group-bg').value;

            if (!title) return alert("O título é obrigatório.");

            if (id) {
                const group = groups.find(g => g.id === id);
                group.title = title;
                group.bgImage = bgImage;
            } else {
                groups.push({ id: crypto.randomUUID(), title, bgImage, order: groups.length, links: [] });
            }
            saveData();
            closeModals();
        }

        function deleteGroup(id) {
            if (confirm('Tem certeza que deseja excluir este grupo e todos os seus links?')) {
                groups = groups.filter(g => g.id !== id);
                saveData();
            }
        }

        // --- CRUD Links (Favoritos) ---
        function openLinkModal(groupId, linkId = null) {
            document.getElementById('link-modal').classList.add('active');
            document.getElementById('link-group-id').value = groupId;
            
            if (linkId) {
                const group = groups.find(g => g.id === groupId);
                const link = group.links.find(l => l.id === linkId);
                
                document.getElementById('link-id').value = link.id;
                document.getElementById('link-title').value = link.title;
                document.getElementById('link-url').value = link.url;
                document.getElementById('link-copy').value = link.copyText || '';
                document.getElementById('link-modal-title').innerText = "Editar Favorito";
            } else {
                document.getElementById('link-id').value = '';
                document.getElementById('link-title').value = '';
                document.getElementById('link-url').value = '';
                document.getElementById('link-copy').value = '';
                document.getElementById('link-modal-title').innerText = "Novo Favorito";
            }
        }

        function saveLink() {
            const groupId = document.getElementById('link-group-id').value;
            const linkId = document.getElementById('link-id').value;
            const title = document.getElementById('link-title').value;
            const url = document.getElementById('link-url').value;
            const copyText = document.getElementById('link-copy').value;

            if (!title || !url) return alert("Título e URL são obrigatórios.");

            const group = groups.find(g => g.id === groupId);

            if (linkId) {
                const link = group.links.find(l => l.id === linkId);
                link.title = title;
                link.url = url;
                link.copyText = copyText;
            } else {
                group.links.push({
                    id: crypto.randomUUID(),
                    title,
                    url,
                    copyText,
                    clicks: 0
                });
            }

            saveData();
            closeModals();
        }

        function deleteLink(groupId, linkId) {
            if(confirm('Excluir este favorito?')) {
                const group = groups.find(g => g.id === groupId);
                group.links = group.links.filter(l => l.id !== linkId);
                saveData();
            }
        }

        // --- Utils e Import/Export ---
        function closeModals() {
            document.querySelectorAll('.modal-overlay:not(.sidebar-overlay)').forEach(m => m.classList.remove('active'));
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(groups));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", `workspaces_backup_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
            showToast('Backup exportado com sucesso!');
        }

        document.getElementById('import-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const importedGroups = JSON.parse(event.target.result);
                    if (Array.isArray(importedGroups)) {
                        groups = importedGroups;
                        saveData();
                        showToast('Backup importado com sucesso!');
                    } else { alert('Formato de arquivo inválido.'); }
                } catch (err) { alert('Erro ao ler o arquivo JSON.'); }
            };
            reader.readAsText(file);
            e.target.value = '';
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModals();
                closeSidebar();
            }
        });

        // Init
        renderGrid();
    </script>
</body>
</html>
